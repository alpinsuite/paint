name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  # attest-build-provenance and attest-sbom need an OIDC token to get a
  # short-lived Sigstore certificate, and write access to the attestations
  # API to store what they produce.
  id-token: write
  attestations: write

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  build:
    name: Build release packages
    runs-on: ubuntu-latest
    # Same glibc 2.35 baseline as CI, so a released binary runs on Ubuntu
    # 22.04+ and Debian 12+ rather than only on the runner's own release.
    # Pinned by digest, not by tag. `ubuntu:22.04` floats: the image behind it
    # is rebuilt, and in a year nobody can reconstruct the environment this
    # release was built in. A digest is the only form of "same container" that
    # survives time, and every reproducibility claim depends on it.
    #
    # To move it, resolve the tag and paste the manifest-list digest:
    #   curl -fsSL https://hub.docker.com/v2/repositories/library/ubuntu/tags/22.04 | jq -r .digest
    container: ubuntu@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc   # 22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install toolchain
        # jq is needed by subosito/flutter-action's setup script and is not in
        # the base image; without it the action fails before Flutter is fetched.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git jq unzip xz-utils zip file \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            dpkg-dev apt-utils desktop-file-utils

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Trust the container's git directories
        # The job runs as root while the checkout and the Flutter SDK are owned
        # by other uids, and git refuses to touch either without this. The
        # wildcard covers the SDK, which flutter-action installs later, and the
        # pub cache; the container is ephemeral, so its scope costs nothing.
        run: git config --global --add safe.directory '*'

      - name: Read the version and check it matches the tag
        id: version
        run: |
          VERSION="$(bash tools/set_version.sh)"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pubspec version $VERSION."
            echo "::error::Run tools/set_version.sh ${TAG#v} and commit before tagging."
            exit 1
          fi
          echo "releasing $VERSION"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          bash packaging/build_deb.sh
          tar -czf "build/dist/paint-${VERSION}-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .

      - name: Build the AppImage
        # Not fatal: a broken appimagetool download must not hold back the .deb,
        # which is the primary artifact.
        continue-on-error: true
        run: bash packaging/build_appimage.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Software Bill of Materials
        # CycloneDX, resolved from pubspec.lock and written in the same job
        # that produced the .deb, so it describes this build rather than
        # somebody's laptop. --check is the gate: it fails on a missing,
        # stale, or incomplete SBOM.
        env:
          SBOM_OUT: build/dist/sbom.cdx.json
        run: |
          bash tools/sbom.sh
          bash tools/sbom.sh --check

      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: build/dist/*
          if-no-files-found: error

  publish:
    name: Publish the release and the APT repository
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist

      - name: Extract this version's changelog section
        id: notes
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          # Everything between this version's heading and the next one.
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { collecting = 1; next }
            collecting && /^## \[/ { exit }
            collecting { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry for $VERSION." > release-notes.md
          fi
          {
            echo ""
            echo "## Install"
            echo ""
            echo '```bash'
            echo "sudo install -d -m 0755 /etc/apt/keyrings"
            echo "curl -fsSL https://apt.buache.systems/buache-systems-archive-keyring.gpg \\"
            echo "  | sudo tee /etc/apt/keyrings/buache-systems.gpg > /dev/null"
            echo "sudo curl -fsSL -o /etc/apt/sources.list.d/buache-systems.sources \\"
            echo "  https://apt.buache.systems/buache-systems.sources"
            echo "sudo apt update && sudo apt install paint"
            echo '```'
            echo ""
            echo "Or download the \`.deb\` below and run \`sudo apt install ./paint_${VERSION}_amd64.deb\`."
          } >> release-notes.md

          # An assurance nobody knows how to check is worth nothing, so the
          # release page carries the two commands rather than assuming anyone
          # goes looking for them.
          {
            echo ""
            echo "## Verify"
            echo ""
            echo "Every file here is listed in \`SHA256SUMS\`, signed with the same key that signs the APT repository:"
            echo ""
            echo '```bash'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gpg --verify SHA256SUMS.asc SHA256SUMS"
            echo '```'
            echo ""
            echo "The packages also carry a signed build provenance attestation, which says which workflow built them and from which commit:"
            echo ""
            echo '```bash'
            echo "gh attestation verify paint_${VERSION}_amd64.deb --repo ${{ github.repository }}"
            echo '```'
          } >> release-notes.md

          cat release-notes.md

      # --- provenance -------------------------------------------------------
      # These run here rather than in the build job because these are the exact
      # bytes about to be attached to the release, and an attestation is bound
      # to a file digest. Same workflow run either way, so the provenance says
      # the same thing about who built it and from which commit.

      - name: Attest the build provenance
        # A signed in-toto SLSA statement binding each artefact's digest to
        # this workflow, this repository and this commit. Signed keylessly
        # through Sigstore: the certificate is short-lived and bound to the
        # workflow's OIDC identity, so there is no signing key to store, leak
        # or rotate, and the record lands in the Rekor transparency log.
        #
        # What it buys a user is one command:
        #   gh attestation verify paint_<version>_amd64.deb --repo ${{ github.repository }}
        # which prints the commit the binary was built from.
        #
        # The .deb and the tarball only. The AppImage step is
        # continue-on-error, and this action fails when a glob matches
        # nothing, which would turn a best-effort artefact into a failed
        # release. Add it here the day it stops being optional.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.gz

      - name: Attest the SBOM
        # Binds the CycloneDX document to the .deb's digest, so "here is the
        # bill of materials" and "here is the package" cannot drift apart.
        # SPEC.md 3.7 asks for exactly this: the SBOM signed as an in-toto
        # attestation and logged to Rekor.
        uses: actions/attest-sbom@v2
        with:
          subject-path: dist/*.deb
          sbom-path: dist/sbom.cdx.json

      # --- checksums --------------------------------------------------------
      - name: Write and sign SHA256SUMS
        # For the person who downloads a file from the releases page and never
        # touches apt. apt verifies the repository signature on their behalf;
        # a direct download has nothing checking it at all.
        #
        # Signed with the same key that signs the APT repository, so there is
        # one fingerprint to know rather than two.
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          cd dist
          # Sorted, and basenames only: the file has to be checkable with a
          # plain `sha256sum -c` from whatever directory the user downloaded
          # into, without a path from this runner leaking into it.
          rm -f SHA256SUMS SHA256SUMS.asc
          # Written outside this directory and moved into place: a redirect
          # creates its target before `find` runs, so a list written here, under
          # any name, contains a line for itself, hashed while empty, and every
          # `sha256sum -c` then reports one failure.
          SUMS_TMP="$(mktemp)"
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%P\n' \
            | sort | xargs --no-run-if-empty sha256sum > "$SUMS_TMP"
          test -s "$SUMS_TMP"   # an empty release is a failed release
          mv "$SUMS_TMP" SHA256SUMS
          chmod 644 SHA256SUMS
          cat SHA256SUMS

          if [ -z "${APT_GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::APT_GPG_PRIVATE_KEY is not set; SHA256SUMS left unsigned."
            exit 0
          fi

          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          GPG_ARGS=(--batch --yes --quiet --local-user "$KEY_ID")
          if [ -n "${APT_GPG_PASSPHRASE:-}" ]; then
            GPG_ARGS+=(--pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE")
          fi
          gpg "${GPG_ARGS[@]}" --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --batch --yes --verify SHA256SUMS.asc SHA256SUMS
          echo "signed with $KEY_ID"
          rm -rf "$GNUPGHOME"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Paint ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}

      # The APT repository is not published from here. alpinsuite/apt rebuilds
      # itself from this Releases page within the hour and signs the result
      # there. To publish now: gh workflow run publish.yml -R alpinsuite/apt
